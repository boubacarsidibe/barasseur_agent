[project]
name = "barasseur"
version = "0.1.0"
description = "Agent de code personnel basé sur l'API Gemini"
requires-python = ">=3.11"
dependencies = ["google-genai>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
barasseur = "barasseur.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["barasseur"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
ignore = ["E501"]
select = ["E", "F", "W", "I", "B", "UP", "BLE", "PLW"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
